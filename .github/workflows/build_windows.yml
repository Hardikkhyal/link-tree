name: Build Windows Desktop App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: false

      - name: Verify Toolchain & Environment
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Clean Project Build Artifacts
        run: flutter clean

      - name: Purge Stale Ephemeral & Build Directories
        shell: pwsh
        run: |
          if (Test-Path "windows/flutter/ephemeral") {
            Remove-Item -Recurse -Force "windows/flutter/ephemeral"
          }
          if (Test-Path "build") {
            Remove-Item -Recurse -Force "build"
          }

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Precache Windows Engine Artifacts
        run: flutter precache --windows

      - name: Populate Windows Ephemeral Directory from SDK Cache
        shell: pwsh
        run: |
          $sdkRoot = $env:FLUTTER_ROOT
          Write-Host "Flutter SDK Root: $sdkRoot"

          $engineCacheDir = "$sdkRoot\bin\cache\artifacts\engine\windows-x64"
          $ephemeralDir   = "windows\flutter\ephemeral"
          $wrapperDst     = "$ephemeralDir\cpp_client_wrapper"

          New-Item -ItemType Directory -Force -Path $ephemeralDir | Out-Null
          New-Item -ItemType Directory -Force -Path $wrapperDst   | Out-Null

          if (Test-Path $engineCacheDir) {
            # Copy DLLs, import libs, and engine headers
            Get-ChildItem $engineCacheDir -File | ForEach-Object {
              Copy-Item $_.FullName -Destination $ephemeralDir -Force
            }

            # Copy cpp_client_wrapper sources and headers
            $wrapperSrc = "$engineCacheDir\cpp_client_wrapper"
            if (Test-Path $wrapperSrc) {
              Copy-Item "$wrapperSrc\*" -Destination $wrapperDst -Recurse -Force
            }
          }

          # Ensure a minimal generated_config.cmake fallback exists if tool didn't write it
          $genConfig = "$ephemeralDir\generated_config.cmake"
          if (-not (Test-Path $genConfig)) {
            Set-Content $genConfig "# Auto-generated fallback config`nset(FLUTTER_ROOT `"$sdkRoot`")"
          }

      - name: Defensive CI Pre-Build Inspection Check
        shell: pwsh
        run: |
          Write-Host "=== Contents of windows/flutter ==="
          if (Test-Path "windows/flutter") {
            Get-ChildItem "windows/flutter"
          } else {
            Write-Host "windows/flutter does not exist!"
          }

          $genConfig = "windows/flutter/ephemeral/generated_config.cmake"
          Write-Host "`n=== Checking generated_config.cmake ==="
          if (Test-Path $genConfig) {
            Write-Host "EXISTS: $genConfig"
          } else {
            Write-Host "MISSING: $genConfig"
          }

          $wrapperInclude = "windows/flutter/ephemeral/cpp_client_wrapper/include"
          Write-Host "`n=== Checking cpp_client_wrapper/include ==="
          if (Test-Path $wrapperInclude) {
            Write-Host "EXISTS: $wrapperInclude"
            Get-ChildItem $wrapperInclude -Recurse | Select-Object -First 10 FullName
          } else {
            Write-Host "MISSING: $wrapperInclude"
          }

      - name: Validate Required Windows Files
        shell: pwsh
        run: |
          $requiredFiles = @(
            "windows/CMakeLists.txt",
            "windows/runner/CMakeLists.txt",
            "windows/runner/main.cpp"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Error "CRITICAL MISSING FILE: $file"
              exit 1
            }
          }

          $iconPath = "windows/runner/resources/app_icon.ico"
          if (-not (Test-Path $iconPath)) {
            Write-Host "Creating missing app_icon.ico fallback resource..."
            New-Item -ItemType Directory -Force -Path "windows/runner/resources" | Out-Null
            [System.IO.File]::WriteAllBytes($iconPath, [System.Convert]::FromBase64String(''))
          }

      - name: Build Windows Executable (Release)
        run: flutter build windows --release --verbose

      # ── Assemble the release bundle ─────────────────────────────────────────
      # flutter build windows places the exe in build/windows/x64/runner/Release
      # but flutter_windows.dll and data/ may be written to different locations
      # depending on Flutter SDK version and CMake config. The helper script
      # performs recursive search + automatic staging into a single output dir.
      - name: Discover & Stage Release Bundle
        id: discover
        shell: pwsh
        run: |
          # Run self-check first to validate the helper itself is working
          pwsh -ExecutionPolicy Bypass -File "scripts/ci/find_windows_release_dir.ps1" -SelfCheck
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Helper script self-check failed. Aborting."
            exit 1
          }

          # Use -OutputFile to receive the resolved path via file instead of stdout capture.
          # This avoids all stdout pollution issues from Write-Host in child pwsh processes,
          # which on Windows runners can bleed into stdout capture ($var = pwsh ...).
          # -AllowAnyExe: if named exes (hk_drop.exe, runner.exe) are absent, fall back to
          # any non-toolchain *.exe found under the build tree (catches renamed output binaries).
          $outFile = [System.IO.Path]::GetTempFileName()
          pwsh -ExecutionPolicy Bypass `
            -File "scripts/ci/find_windows_release_dir.ps1" `
            -SearchRoot "build/windows/x64" `
            -ExeNames "hk_drop.exe","runner.exe" `
            -OutputFile $outFile `
            -AllowAnyExe
          $exitCode = $LASTEXITCODE

          # Null-safe read: Get-Content returns $null if the file is empty (script exited before writing).
          # Calling .Trim() on $null throws; guard with explicit null check.
          $releaseDir = ""
          if (Test-Path $outFile) {
            $rawContent = Get-Content $outFile -Raw -ErrorAction SilentlyContinue
            if ($rawContent -ne $null) { $releaseDir = $rawContent.Trim() }
            Remove-Item $outFile -Force -ErrorAction SilentlyContinue
          }

          if ($exitCode -ne 0 -or -not $releaseDir -or -not (Test-Path $releaseDir)) {
            Write-Host ""
            Write-Host "=== PACKAGING FAILURE ==="
            Write-Host "Could not assemble a complete Windows release bundle."
            Write-Host "Exit code: $exitCode"
            Write-Host "Resolved path: '$releaseDir'"
            Write-Host "flutter build output tree:"
            if (Test-Path "build/windows") {
              Get-ChildItem "build/windows" -Recurse |
                Select-Object -First 200 FullName
            } else {
              Write-Host "build/windows does not exist!"
            }
            exit 1
          }

          Write-Host "Release bundle ready at: $releaseDir"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_DIR=$releaseDir"


      - name: Verify Release Bundle Contents
        shell: pwsh
        run: |
          $releaseDir = $env:RELEASE_DIR
          if (-not $releaseDir -or -not (Test-Path $releaseDir)) {
            Write-Error "RELEASE_DIR is missing or invalid."
            exit 1
          }

          Write-Host "=== Release bundle contents: $releaseDir ==="
          Get-ChildItem -Path $releaseDir -Recurse |
            Select-Object @{N='RelPath';E={$_.FullName.Replace($releaseDir,'').TrimStart('\')}} , Length |
            Format-Table -AutoSize

          # Hard validate required files
          $requiredInBundle = @("flutter_windows.dll")
          $missingFiles = @()
          foreach ($f in $requiredInBundle) {
            if (-not (Test-Path (Join-Path $releaseDir $f))) {
              $missingFiles += $f
            }
          }

          $hasExe = (Test-Path (Join-Path $releaseDir "hk_drop.exe")) -or (Test-Path (Join-Path $releaseDir "runner.exe"))
          if (-not $hasExe) { $missingFiles += "hk_drop.exe or runner.exe" }

          $hasData = (Test-Path (Join-Path $releaseDir "data")) -or (Test-Path (Join-Path $releaseDir "data/flutter_assets"))
          if (-not $hasData) { $missingFiles += "data/" }

          if ($missingFiles.Count -gt 0) {
            Write-Error "Bundle is incomplete. Missing: $($missingFiles -join ', ')"
            exit 1
          }

          Write-Host "Bundle validation PASSED."

      - name: Compress Windows Build Folder
        shell: pwsh
        run: |
          $releaseDir = $env:RELEASE_DIR
          if (-not $releaseDir -or -not (Test-Path $releaseDir)) {
            Write-Error "RELEASE_DIR is missing or path does not exist. Cannot compress."
            exit 1
          }

          $zipPath = "build/hk-drop-windows-x64.zip"
          Write-Host "Compressing: $releaseDir -> $zipPath"

          # Use Get-ChildItem pipeline to ensure subdirectories are included
          Get-ChildItem -Path $releaseDir | Compress-Archive -DestinationPath $zipPath -Force

          if (-not (Test-Path $zipPath)) {
            Write-Error "Zip file was not created at $zipPath"
            exit 1
          }

          $zipSize = (Get-Item $zipPath).Length
          if ($zipSize -lt 1024) {
            Write-Error "Zip file is suspiciously small ($zipSize bytes). Aborting."
            exit 1
          }

          Write-Host "Artifact ready: $zipPath ($zipSize bytes)"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hk-drop-windows-x64
          path: build/hk-drop-windows-x64.zip
          retention-days: 30
