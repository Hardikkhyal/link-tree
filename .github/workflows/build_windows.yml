name: Build Windows Desktop App

on:
  push:
    branches: [ main, master, new ]
  pull_request:
    branches: [ main, master, new ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Regenerate windows/flutter/CMakeLists.txt from Flutter SDK template
        shell: pwsh
        run: |
          # Flutter SDK keeps the canonical CMakeLists.txt for windows/flutter/ at:
          # $FLUTTER_ROOT/packages/flutter_tools/templates/app/windows.tmpl/flutter/CMakeLists.txt.tmpl
          # flutter pub get / flutter create regenerates this file.
          # We overwrite our (potentially broken) custom version with the SDK-generated one.
          
          $sdkCmake = "$env:FLUTTER_ROOT\packages\flutter_tools\templates\app_shared\windows.tmpl\flutter\CMakeLists.txt.tmpl"
          $altCmake = "$env:FLUTTER_ROOT\packages\flutter_tools\templates\app\windows.tmpl\flutter\CMakeLists.txt.tmpl"
          
          Write-Host "Looking for Flutter SDK CMakeLists template..."
          Write-Host "SDK path: $env:FLUTTER_ROOT"
          
          # Find the template anywhere in the Flutter SDK
          $template = Get-ChildItem "$env:FLUTTER_ROOT\packages\flutter_tools\templates" -Recurse -Filter "CMakeLists.txt.tmpl" -ErrorAction SilentlyContinue | 
            Where-Object { $_.FullName -like "*windows*flutter*" } | 
            Select-Object -First 1
          
          if ($template) {
            Write-Host "Found template: $($template.FullName)"
            $content = Get-Content $template.FullName -Raw
            # Remove template variables ({{projectName}} etc) since we just need the cmake logic
            $content = $content -replace '\{\{[^}]+\}\}', 'hk_drop'
            Set-Content "windows\flutter\CMakeLists.txt" $content -Encoding UTF8
            Write-Host "Restored windows/flutter/CMakeLists.txt from SDK template"
          } else {
            Write-Host "Template not found, listing flutter_tools templates:"
            Get-ChildItem "$env:FLUTTER_ROOT\packages\flutter_tools\templates" -Recurse -Filter "*.tmpl" | Select-Object FullName
          }

      - name: Build Windows Executable (Release)
        run: flutter build windows --release

      - name: Compress Windows Build Folder
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\hk-drop-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hk-drop-windows-x64
          path: build/hk-drop-windows-x64.zip
          retention-days: 30
