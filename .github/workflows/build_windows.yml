name: Build Windows Desktop App

on:
  push:
    branches: [ main, master, new ]
  pull_request:
    branches: [ main, master, new ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Verify Toolchain Environment
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Download Windows Engine Artifacts
        run: flutter precache --windows

      - name: Validate Required Windows Files
        shell: pwsh
        run: |
          $requiredFiles = @(
            "windows/CMakeLists.txt",
            "windows/runner/CMakeLists.txt",
            "windows/runner/main.cpp"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Error "CRITICAL MISSING FILE: $file"
              exit 1
            }
          }

          $iconPath = "windows/runner/resources/app_icon.ico"
          if (-not (Test-Path $iconPath)) {
            Write-Host "Creating missing app_icon.ico fallback resource..."
            New-Item -ItemType Directory -Force -Path "windows/runner/resources" | Out-Null
            [System.IO.File]::WriteAllBytes($iconPath, [System.Convert]::FromBase64String(''))
          }

      - name: Build Windows Executable (Release)
        run: flutter build windows --release -v

      - name: Validate Build Output Exists
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $releaseDir)) {
            Write-Error "Release build output directory does not exist: $releaseDir"
            exit 1
          }

      - name: Compress Windows Build Folder
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\hk-drop-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hk-drop-windows-x64
          path: build/hk-drop-windows-x64.zip
          retention-days: 30
