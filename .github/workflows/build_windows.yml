name: Build Windows Desktop App

on:
  push:
    branches: [ main, master, new ]
  pull_request:
    branches: [ main, master, new ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Validate and ensure Windows app icon exists
        shell: pwsh
        run: |
          $iconPath = "windows/runner/resources/app_icon.ico"
          if (-not (Test-Path $iconPath)) {
            Write-Host "Creating missing $iconPath..."
            New-Item -ItemType Directory -Force -Path "windows/runner/resources" | Out-Null
            [System.IO.File]::WriteAllBytes($iconPath, [System.Convert]::FromBase64String(''))
          }

      - name: Copy Flutter engine artifacts from SDK cache into ephemeral
        shell: pwsh
        run: |
          $sdkRoot = $env:FLUTTER_ROOT
          Write-Host "Flutter SDK: $sdkRoot"

          $engineCacheDir = "$sdkRoot\bin\cache\artifacts\engine\windows-x64"
          $ephemeralDir   = "windows\flutter\ephemeral"
          $wrapperDst     = "$ephemeralDir\cpp_client_wrapper"

          Write-Host "Engine cache dir: $engineCacheDir"

          if (-not (Test-Path $engineCacheDir)) {
            Write-Host "Engine cache not found, running flutter precache..."
            flutter precache --windows
          }

          Write-Host "Contents of engine cache:"
          Get-ChildItem $engineCacheDir | Select-Object Name, Length

          # Create ephemeral dir
          New-Item -ItemType Directory -Force -Path $ephemeralDir | Out-Null
          New-Item -ItemType Directory -Force -Path $wrapperDst   | Out-Null

          # Copy ALL engine artifacts: .dll, .dll.lib, .dll.exp, .h, .dat, .lib
          Get-ChildItem $engineCacheDir -File | ForEach-Object {
            Copy-Item $_.FullName -Destination $ephemeralDir -Force
            Write-Host "Copied: $($_.Name)"
          }

          # Copy cpp_client_wrapper (sources + include/ headers)
          $wrapperSrc = "$engineCacheDir\cpp_client_wrapper"
          if (Test-Path $wrapperSrc) {
            Copy-Item "$wrapperSrc\*" -Destination $wrapperDst -Recurse -Force
            Write-Host "Copied cpp_client_wrapper from: $wrapperSrc"
          } else {
            # Fallback: search anywhere in Flutter SDK cache
            $alt = Get-ChildItem "$sdkRoot\bin\cache" -Recurse -Filter "core_implementations.cc" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($alt) {
              Write-Host "Found wrapper at: $($alt.DirectoryName)"
              Copy-Item "$($alt.DirectoryName)\*" -Destination $wrapperDst -Recurse -Force
            } else {
              Write-Host "ERROR: cpp_client_wrapper not found in SDK cache"
              exit 1
            }
          }

          Write-Host "\nFinal ephemeral contents:"
          Get-ChildItem $ephemeralDir -Recurse | Select-Object FullName

      - name: Build Windows Executable (Release)
        run: flutter build windows --release

      - name: Compress Windows Build Folder
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\hk-drop-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hk-drop-windows-x64
          path: build/hk-drop-windows-x64.zip
          retention-days: 30
