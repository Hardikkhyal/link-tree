name: Build Windows Desktop App

on:
  push:
    branches: [ main, master, new ]
  pull_request:
    branches: [ main, master, new ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: false

      - name: Verify Toolchain & Environment
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Clean Project Build Artifacts
        run: flutter clean

      - name: Purge Stale Ephemeral & Build Directories
        shell: pwsh
        run: |
          if (Test-Path "windows/flutter/ephemeral") {
            Remove-Item -Recurse -Force "windows/flutter/ephemeral"
          }
          if (Test-Path "build") {
            Remove-Item -Recurse -Force "build"
          }

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Precache Windows Engine Artifacts
        run: flutter precache --windows

      - name: Populate Windows Ephemeral Directory from SDK Cache
        shell: pwsh
        run: |
          $sdkRoot = $env:FLUTTER_ROOT
          Write-Host "Flutter SDK Root: $sdkRoot"

          $engineCacheDir = "$sdkRoot\bin\cache\artifacts\engine\windows-x64"
          $ephemeralDir   = "windows\flutter\ephemeral"
          $wrapperDst     = "$ephemeralDir\cpp_client_wrapper"

          New-Item -ItemType Directory -Force -Path $ephemeralDir | Out-Null
          New-Item -ItemType Directory -Force -Path $wrapperDst   | Out-Null

          if (Test-Path $engineCacheDir) {
            # Copy DLLs, import libs, and engine headers
            Get-ChildItem $engineCacheDir -File | ForEach-Object {
              Copy-Item $_.FullName -Destination $ephemeralDir -Force
            }

            # Copy cpp_client_wrapper sources and headers
            $wrapperSrc = "$engineCacheDir\cpp_client_wrapper"
            if (Test-Path $wrapperSrc) {
              Copy-Item "$wrapperSrc\*" -Destination $wrapperDst -Recurse -Force
            }
          }

          # Ensure a minimal generated_config.cmake fallback exists if tool didn't write it
          $genConfig = "$ephemeralDir\generated_config.cmake"
          if (-not (Test-Path $genConfig)) {
            Set-Content $genConfig "# Auto-generated fallback config`nset(FLUTTER_ROOT `"$sdkRoot`")"
          }

      - name: Defensive CI Pre-Build Inspection Check
        shell: pwsh
        run: |
          Write-Host "=== Contents of windows/flutter ==="
          if (Test-Path "windows/flutter") {
            Get-ChildItem "windows/flutter"
          } else {
            Write-Host "windows/flutter does not exist!"
          }

          $genConfig = "windows/flutter/ephemeral/generated_config.cmake"
          Write-Host "`n=== Checking generated_config.cmake ==="
          if (Test-Path $genConfig) {
            Write-Host "EXISTS: $genConfig"
          } else {
            Write-Host "MISSING: $genConfig"
          }

          $wrapperInclude = "windows/flutter/ephemeral/cpp_client_wrapper/include"
          Write-Host "`n=== Checking cpp_client_wrapper/include ==="
          if (Test-Path $wrapperInclude) {
            Write-Host "EXISTS: $wrapperInclude"
            Get-ChildItem $wrapperInclude -Recurse | Select-Object -First 10 FullName
          } else {
            Write-Host "MISSING: $wrapperInclude"
          }

      - name: Validate Required Windows Files
        shell: pwsh
        run: |
          $requiredFiles = @(
            "windows/CMakeLists.txt",
            "windows/runner/CMakeLists.txt",
            "windows/runner/main.cpp"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Error "CRITICAL MISSING FILE: $file"
              exit 1
            }
          }

          $iconPath = "windows/runner/resources/app_icon.ico"
          if (-not (Test-Path $iconPath)) {
            Write-Host "Creating missing app_icon.ico fallback resource..."
            New-Item -ItemType Directory -Force -Path "windows/runner/resources" | Out-Null
            [System.IO.File]::WriteAllBytes($iconPath, [System.Convert]::FromBase64String(''))
          }

      - name: Build Windows Executable (Release)
        run: flutter build windows --release --verbose

      # Note: Dynamic release-directory discovery via scripts/ci/find_windows_release_dir.ps1
      # is required because Flutter and CMake output directory structures vary depending on
      # Flutter SDK version, CMake generator settings, and toolchain configurations
      # (e.g. build/windows/x64/runner/Release vs build/windows/x64/runner/runner/Release vs build/windows/x64/Release).
      - name: Stage Complete Windows Release Bundle
        shell: pwsh
        run: |
          if (Test-Path "build/windows/x64") {
            Write-Host "Staging release assets via cmake --install..."
            try {
              cmake --install build/windows/x64 --config Release
            } catch {
              Write-Host "WARNING: cmake --install failed! Inspecting CMake logs..."
              if (Test-Path "build/windows/x64/CMakeCache.txt") {
                Get-Content "build/windows/x64/CMakeCache.txt" -Head 50
              }
              Write-Error "cmake --install step failed: $_"
              exit 1
            }
          } else {
            Write-Host "build/windows/x64 directory does not exist, skipping explicit cmake --install."
          }

      - name: Validate Build Output Exists & Discover Release Directory
        shell: pwsh
        run: |
          # Test reusable helper self-check first
          pwsh -ExecutionPolicy Bypass -File "scripts/ci/find_windows_release_dir.ps1" -SelfCheck

          Write-Host "=== Candidate .exe files under build/windows/x64 ==="
          if (Test-Path "build/windows/x64") {
            Get-ChildItem "build/windows/x64" -Recurse -Filter *.exe | Select-Object FullName
          }

          Write-Host "Discovering release directory under build/windows/x64..."
          $releaseDir = pwsh -ExecutionPolicy Bypass -File "scripts/ci/find_windows_release_dir.ps1" -SearchRoot "build/windows/x64" -ExeNames "link_tree.exe","hk_drop.exe","runner.exe"
          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0 -or -not $releaseDir) {
            Write-Host "CRITICAL: Failed to locate valid release directory! Printing diagnostic directory tree..."
            Write-Host "`n=== Recursive directory tree of build/windows ==="
            if (Test-Path "build/windows") {
              Get-ChildItem "build/windows" -Recurse | Select-Object FullName
            } else {
              Write-Host "build/windows directory does not exist!"
            }

            Write-Host "`n=== CMake install tree under build/windows/x64/runner ==="
            if (Test-Path "build/windows/x64/runner") {
              Get-ChildItem "build/windows/x64/runner" -Recurse | Select-Object FullName
            } else {
              Write-Host "build/windows/x64/runner directory does not exist!"
            }
            exit 1
          }

          Write-Host "Discovered valid release directory: $releaseDir"
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_DIR=$releaseDir"
          
          Write-Host "Verified release directory contents:"
          Get-ChildItem -Path $releaseDir

      - name: Compress Windows Build Folder
        shell: pwsh
        run: |
          $releaseDir = $env:RELEASE_DIR
          if (-not $releaseDir -or -not (Test-Path $releaseDir)) {
            Write-Host "RELEASE_DIR env var missing or invalid. Invoking helper discovery fallback..."
            $releaseDir = pwsh -ExecutionPolicy Bypass -File "scripts/ci/find_windows_release_dir.ps1" -SearchRoot "build/windows/x64" -ExeNames "link_tree.exe","hk_drop.exe","runner.exe"
          }

          if (-not $releaseDir -or -not (Test-Path $releaseDir)) {
            Write-Error "CRITICAL: Cannot compress - valid release directory not found."
            exit 1
          }

          $zipPath = "build/hk-drop-windows-x64.zip"
          Write-Host "Compressing release bundle from $releaseDir into $zipPath..."
          Get-ChildItem -Path $releaseDir | Compress-Archive -DestinationPath $zipPath -Force
          
          if (-not (Test-Path $zipPath)) {
            Write-Error "CRITICAL: Zip creation failed! $zipPath was not generated."
            exit 1
          }
          Write-Host "Successfully compressed release bundle to $zipPath (Size: $((Get-Item $zipPath).Length) bytes)"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hk-drop-windows-x64
          path: build/hk-drop-windows-x64.zip
          retention-days: 30
